<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bejelentkezés - Nails By Vera</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-body">

    <div class="container d-flex justify-content-center align-items-center vh-100">

        <div class="row w-100 login-container shadow">

            <div class="col-md-6 p-5 d-flex flex-column justify-content-center align-items-center login-box-left">
                <h2 class="mb-4 fw-bold">Belépés</h2>
                <form id="loginForm" class="w-100 d-flex flex-column align-items-center">
                    <input type="email" id="email" name="email" class="form-control mb-3 w-75 p-2"
                        placeholder="E-mail cím" autocomplete="email" required>

                    <input type="password" id="jelszo" name="jelszo" class="form-control mb-4 w-75 p-2"
                        placeholder="Jelszó" autocomplete="current-password" required>

                    <button type="submit" class="btn btn-dark px-4 py-2">Bejelentkezés</button>
                </form>
                <a href="#" class="mt-4 text-decoration-none forget-link">Elfelejtetted a jelszavad?</a>
            </div>

            <div class="col-md-6 p-5 d-flex flex-column justify-content-center align-items-center text-center">
                <img src="images/logo.png" alt="Nails by Vera Logó" class="img-fluid mb-4" style="max-width: 180px;">
                <h1 class="fs-3 fw-bold mb-4">Üdvözöljük az oldalon!</h1>
                <p class="m-0" style="color: var(--text-and-btn); font-size: 16px;">
                    Még nincs fiókod? <a href="regisztracio.html"
                        class="fw-bold text-decoration-none forget-link ms-1">Regisztrálj itt!</a>
                </p>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
