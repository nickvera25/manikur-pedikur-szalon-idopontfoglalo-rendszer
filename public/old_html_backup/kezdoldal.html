<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kezdőoldal - Nails By Vera</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg custom-navbar">
        <div class="container-fluid px-5">
            <a class="navbar-brand" href="#">
                <img src="images/logo.png" alt="Logo" width="30" height="30" class="d-inline-block align-text-top">
                NAILS BY VERA
            </a>
            <div class="collapse navbar-collapse justify-content-end">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="#">Rólunk</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Házirend</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button"
                            data-bs-toggle="dropdown">Időpontok</a>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="#">Galéria</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Profilom</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html">Kijelentkezés <i
                                class="fa-solid fa-right-from-bracket"></i></a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-10 content-card-wrapper p-5">

                <h1 id="welcomeText">Üdvözöljük az oldalon!</h1>

                <div class="row g-4">
                    <div class="col-md-6">
                        <div class="card h-100 action-card text-center p-4">
                            <div class="card-body">
                                <div class="icon-circle mb-3">
                                    <i class="fa-regular fa-calendar-check"></i>
                                </div>
                                <h3 class="card-title">Közelgő időpontod:</h3>
                                <p class="card-text fs-4 fw-bold">(pelda)2026.05.16.</p>
                                <button class="btn btn-dark mt-4 px-4">Lemondás</button>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="card h-100 action-card text-center p-4">
                            <div class="card-body">
                                <div class="icon-circle mb-3">
                                    <i class="fa-solid fa-plus"></i>
                                </div>
                                <h3 class="card-title">Szeretnél foglalni?</h3>
                                <button class="btn btn-dark mt-4 px-4">Foglalás</button>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
